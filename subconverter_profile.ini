[custom]
; =================================================================
; 订阅转换自定义配置文件 (Subconverter External Profile)
; 严格仅包含 6 个策略组:
;   1. 🚀 节点选择 (主入口，可选择 5 国自动优选或具体节点)
;   2. 🇺🇸 美国自动 (仅美国节点自动测速选最低延迟)
;   3. 🇯🇵 日本自动 (仅日本节点自动测速选最低延迟)
;   4. 🇸🇬 新加坡自动 (仅新加坡节点自动测速选最低延迟)
;   5. 🇰🇷 韩国自动 (仅韩国节点自动测速选最低延迟)
;   6. 🇹🇼 台湾自动 (仅台湾节点自动测速选最低延迟)
; =================================================================

; 基础配置与 Clash 模板
clash_rule_base=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GeneralClashConfig.yml

; -----------------------------------------------------------------
; 仅保留 6 个策略组定义 (custom_proxy_group)
; 格式: 组名`类型`规则1`规则2`...`测速URL`时间间隔(秒),,公差(毫秒)
; -----------------------------------------------------------------

; 1. 主节点选择器
custom_proxy_group=🚀 节点选择`select`[]🇺🇸 美国自动`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇰🇷 韩国自动`[]🇹🇼 台湾自动`[]DIRECT`.*

; 2. 5 大国家/地区自动测速优选组 (附带 []REJECT 保底，当无对应国家节点时不报错并安全停用)
custom_proxy_group=🇺🇸 美国自动`url-test`[]REJECT`(?i)(美|美国|洛杉矶|圣何塞|西雅图|芝加哥|纽约|硅谷|达拉斯|波特兰|凤凰城|迈阿密|弗吉尼亚|US|USA|United\s*States|America)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本自动`url-test`[]REJECT`(?i)(日|日本|东京|大阪|埼玉|川崎|横滨|名古屋|福冈|广岛|JP|JPN|Japan)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡自动`url-test`[]REJECT`(?i)(新|新加坡|坡|狮城|SG|SGP|Singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国自动`url-test`[]REJECT`(?i)(韩|韩国|首尔|仁川|春川|KR|KOR|Korea)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾自动`url-test`[]REJECT`(?i)(台|台湾|新北|台北|台中|高雄|新竹|TW|TWN|Taiwan)`http://www.gstatic.com/generate_204`300,,50

; -----------------------------------------------------------------
; 分流规则集定义 (国内与下载直连，其余所有流量走 🚀 节点选择)
; -----------------------------------------------------------------
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
ruleset=DIRECT,[]GEOIP,CN
ruleset=🚀 节点选择,[]FINAL
