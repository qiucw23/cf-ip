[custom]
; =================================================================
; 订阅转换自定义配置文件 (Subconverter External Profile)
; 特性:
;   1. 独立分组: 🇺🇸 美国节点、🇯🇵 日本节点、🇸🇬 新加坡节点 三大国家独立提取
;   2. 自动测速: 每个独立国家均配备专属自动测速组 (URL-Test)，选出最低延迟
;   3. 全局兜底: 🌐 其他节点 自动聚合其余国家与地区节点
;   4. 智能分流: 针对 OpenAI/ChatGPT、Telegram、YouTube、国内直连与广告拦截
; =================================================================

; 基础配置与 Clash 模板
clash_rule_base=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GeneralClashConfig.yml

; -----------------------------------------------------------------
; 策略组定义 (custom_proxy_group)
; 格式: 组名`类型`规则1`规则2`...`测速URL`时间间隔(秒),,公差(毫秒)
; -----------------------------------------------------------------

; 1. 主节点选择 (默认入口)
custom_proxy_group=🚀 节点选择`select`[]⚡ 自动优选`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🌐 其他节点`[]🎯 全球直连`.*

; 2. 全节点延迟最优自动优选
custom_proxy_group=⚡ 自动优选`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 3. 🇺🇸 美国节点 (独立分组 & 手动切换)
custom_proxy_group=🇺🇸 美国节点`select`[]🇺🇸 美国自动`[]🚀 节点选择`(?i)(美|美国|洛杉矶|圣何塞|西雅图|芝加哥|纽约|硅谷|达拉斯|波特兰|凤凰城|迈阿密|弗吉尼亚|US|USA|United\s*States|America)

; 4. 🇺🇸 美国自动优选 (仅在美国节点中自动测速选最低延迟)
custom_proxy_group=🇺🇸 美国自动`url-test`(?i)(美|美国|洛杉矶|圣何塞|西雅图|芝加哥|纽约|硅谷|达拉斯|波特兰|凤凰城|迈阿密|弗吉尼亚|US|USA|United\s*States|America)`http://www.gstatic.com/generate_204`300,,50

; 5. 🇯🇵 日本节点 (独立分组 & 手动切换)
custom_proxy_group=🇯🇵 日本节点`select`[]🇯🇵 日本自动`[]🚀 节点选择`(?i)(日|日本|东京|大阪|埼玉|川崎|横滨|名古屋|福冈|广岛|JP|JPN|Japan)

; 6. 🇯🇵 日本自动优选 (仅在日本节点中自动测速选最低延迟)
custom_proxy_group=🇯🇵 日本自动`url-test`(?i)(日|日本|东京|大阪|埼玉|川崎|横滨|名古屋|福冈|广岛|JP|JPN|Japan)`http://www.gstatic.com/generate_204`300,,50

; 7. 🇸🇬 新加坡节点 (独立分组 & 手动切换)
custom_proxy_group=🇸🇬 新加坡节点`select`[]🇸🇬 新加坡自动`[]🚀 节点选择`(?i)(新|新加坡|坡|狮城|SG|SGP|Singapore)

; 8. 🇸🇬 新加坡自动优选 (仅在新加坡节点中自动测速选最低延迟)
custom_proxy_group=🇸🇬 新加坡自动`url-test`(?i)(新|新加坡|坡|狮城|SG|SGP|Singapore)`http://www.gstatic.com/generate_204`300,,50

; 9. 🌐 其他国家与地区节点 (排除美、日、新后的全部节点)
custom_proxy_group=🌐 其他节点`select`[]⚡ 自动优选`[]🚀 节点选择`(?i)^(?!.*(美|美国|洛杉矶|圣何塞|西雅图|芝加哥|纽约|硅谷|达拉斯|波特兰|凤凰城|迈阿密|弗吉尼亚|US|USA|United\s*States|America|日|日本|东京|大阪|埼玉|川崎|横滨|名古屋|福冈|广岛|JP|JPN|Japan|新|新加坡|坡|狮城|SG|SGP|Singapore)).*

; 10. 常用服务分流策略组
custom_proxy_group=🤖 人工智能`select`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🚀 节点选择
custom_proxy_group=📲 电报消息`select`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇺🇸 美国节点`[]🚀 节点选择
custom_proxy_group=📹 油管视频`select`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇺🇸 美国节点`[]🚀 节点选择
custom_proxy_group=🎬 国际流媒体`select`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇺🇸 美国节点`[]🚀 节点选择
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]⚡ 自动优选`[]🎯 全球直连

; -----------------------------------------------------------------
; 分流规则集定义 (Rule-Set)
; -----------------------------------------------------------------
; 广告拦截
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; AI / OpenAI 服务
ruleset=🤖 人工智能,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

; Telegram 专线
ruleset=📲 电报消息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Telegram.list

; YouTube 专线
ruleset=📹 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list

; 国际流媒体 (Netflix / Disney+ / Spotify)
ruleset=🎬 国际流媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=🎬 国际流媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/DisneyPlus.list
ruleset=🎬 国际流媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Spotify.list

; 国内直连规则 (域名 / 常见直连服务)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
ruleset=🎯 全球直连,[]GEOIP,CN

; 兜底匹配
ruleset=🐟 漏网之鱼,[]FINAL
